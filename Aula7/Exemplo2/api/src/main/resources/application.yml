spring:
  application:
    name: dw-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5435/dw_demo}
    username: ${SPRING_DATASOURCE_USERNAME:dw}
    password: ${SPRING_DATASOURCE_PASSWORD:dw}
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
