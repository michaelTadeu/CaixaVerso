services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: dw
      POSTGRES_PASSWORD: dw
      POSTGRES_DB: dw_demo
    ports:
      - "5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: ./api
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/dw_demo
      SPRING_DATASOURCE_USERNAME: dw
      SPRING_DATASOURCE_PASSWORD: dw
      SERVER_PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      - postgres

  worker:
    build: ./worker
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/dw_demo
      SPRING_DATASOURCE_USERNAME: dw
      SPRING_DATASOURCE_PASSWORD: dw
      SERVER_PORT: 8081
      ETL_SCHEDULE_CRON: "0 */2 * * * *"
    ports:
      - "8081:8081"
    depends_on:
      - postgres

volumes:
  pgdata:
